# Construit le paquet de deploiement de Kaizen Toolbox et le publie comme
# artefact. Meme principe que le pipeline de Flash Industriel.
#
# Declenchement manuel : on ne veut pas qu'un simple push reconstruise un
# paquet destine a la production.
trigger: none
pr: none

pool:
  vmImage: 'windows-latest'

steps:

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Installer Node.js'

- script: |
    npm ci --omit=dev
  displayName: 'Installer les dependances'

# Creation du package de deploiement
- powershell: |
    $publishFolder = "$(Build.ArtifactStagingDirectory)\publish"

    New-Item -ItemType Directory -Force -Path $publishFolder

    Copy-Item "package.json" $publishFolder
    Copy-Item "package-lock.json" $publishFolder -ErrorAction SilentlyContinue
    Copy-Item "web.config" $publishFolder -ErrorAction SilentlyContinue
    Copy-Item ".env.example" $publishFolder -ErrorAction SilentlyContinue
    Copy-Item "LANCEMENT.md" $publishFolder -ErrorAction SilentlyContinue

    # Fichiers sans lesquels l'application ne demarre pas : -ErrorAction Stop
    # volontairement, mieux vaut un build en echec qu'un deploiement
    # silencieusement incomplet.
    Copy-Item "server-sqlserver.js" $publishFolder -ErrorAction Stop
    Copy-Item -Recurse "data" $publishFolder -ErrorAction Stop
    Copy-Item -Recurse "lib"  $publishFolder -ErrorAction Stop

    # public/ porte les pages, le style et les six trames SWM remplissables.
    Copy-Item -Recurse "public" $publishFolder -ErrorAction Stop

    # Copie des dependances npm
    Copy-Item -Recurse "node_modules" $publishFolder

  displayName: "Preparer le package"

- task: ArchiveFiles@2
  displayName: 'Creer le ZIP'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)\publish'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)\kaizen-toolbox_ReleaseTest.zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  displayName: 'Publier le ZIP'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)\kaizen-toolbox_ReleaseTest.zip'
    ArtifactName: 'KaizenToolbox_ReleaseTEST_artifact'
    publishLocation: 'Container'
